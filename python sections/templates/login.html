<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BudgetControl</title>
  <link rel="icon" type="image/png" href="{{ url_for('favicon') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    /* ── Reset para tela de login ───────────────────────────────────── */
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--primaria);
      padding: 1rem;
    }

    /* ── Card de login ──────────────────────────────────────────────── */
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0,0,0,0.2);
      padding: 2.8rem 2.5rem 2.2rem;
      width: 100%;
      max-width: 400px;
      animation: fadeInUp 0.35s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-6px); }
      80%       { transform: translateX(6px); }
    }

    .login-card.shake {
      animation: shake 0.4s ease;
    }

    /* ── Logo e marca ───────────────────────────────────────────────── */
    .login-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.8rem;
    }

    .login-brand-icon {
      width: 44px;
      height: 44px;
      background: var(--primaria);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .login-brand-texto h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primaria);
      line-height: 1.1;
    }

    .login-brand-texto p {
      font-size: 0.78rem;
      color: var(--cinza-400);
      margin-top: 2px;
    }

    /* ── Formulário ─────────────────────────────────────────────────── */
    .login-form-grupo {
      margin-bottom: 1.1rem;
    }

    .login-form-grupo label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--cinza-700);
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    .login-input-wrap {
      position: relative;
    }

    .login-input-wrap input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid var(--cinza-200);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--cinza-800);
      background: var(--cinza-50);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .login-input-wrap input:focus {
      border-color: var(--primaria);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(5, 3, 0, 0.1);
    }

    /* Input senha com botão de toggle */
    .login-input-wrap input[type="password"],
    .login-input-wrap input[type="text"].senha-input {
      padding-right: 2.8rem;
    }

    .btn-toggle-senha {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--cinza-400);
      padding: 0.25rem;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .btn-toggle-senha:hover {
      color: var(--cinza-700);
    }

    /* ── Mensagem de erro ───────────────────────────────────────────── */
    .login-erro {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--vermelho-bg);
      color: var(--vermelho);
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.1rem;
    }

    .login-erro svg {
      flex-shrink: 0;
    }

    /* ── Botão entrar ───────────────────────────────────────────────── */
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background: var(--primaria);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      margin-top: 0.5rem;
      letter-spacing: 0.01em;
    }

    .btn-login:hover {
      background: var(--primaria-hover);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ── Rodapé do card ─────────────────────────────────────────────── */
    .login-footer {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.75rem;
      color: var(--cinza-400);
    }

    .login-ajuda {
      margin-top: 0.7rem;
      font-size: 0.72rem;
      color: var(--cinza-400);
      line-height: 1.45;
    }

    .login-ajuda code {
      font-size: 0.7rem;
      background: var(--cinza-100);
      padding: 0.12rem 0.35rem;
      border-radius: 4px;
      color: var(--cinza-700);
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card" id="login-card">
    <!-- Marca -->
    <div class="login-brand">
      <div class="login-brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <div class="login-brand-texto">
        <h1>BudgetControl</h1>
        <p>Sistema de Controle Orçamentário</p>
      </div>
    </div>

    <!-- Mensagem de erro (server-side) -->
    {% if erro %}
    <div class="login-erro" id="msg-erro">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ erro }}
    </div>
    {% endif %}

    <!-- Formulário -->
    <form method="POST" action="/login" id="form-login">
      <div class="login-form-grupo">
        <label for="username">Usuário</label>
        <div class="login-input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
            autofocus
          />
        </div>
      </div>

      <div class="login-form-grupo">
        <label for="senha">Senha</label>
        <div class="login-input-wrap">
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
            class="senha-input"
          />
          <button type="button" class="btn-toggle-senha" id="btn-toggle-senha" title="Mostrar/ocultar senha">
            <!-- Ícone olho fechado (padrão = senha oculta) -->
            <svg id="ico-olho-fechado" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
            <!-- Ícone olho aberto (visível ao mostrar senha) -->
            <svg id="ico-olho-aberto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>

    <div class="login-footer">
      BudgetControl &nbsp;·&nbsp; Acesso restrito
      <p class="login-ajuda">
        Esqueceu a senha de login? Entre em contato com o suporte técnico do sistema para redefinir a senha.
      </p>
    </div>
  </div>

  <script>
    // Toggle mostrar/ocultar senha
    const btnToggle = document.getElementById('btn-toggle-senha');
    const inputSenha = document.getElementById('senha');
    const icoFechado = document.getElementById('ico-olho-fechado');
    const icoAberto  = document.getElementById('ico-olho-aberto');

    btnToggle.addEventListener('click', () => {
      const visivel = inputSenha.type === 'text';
      inputSenha.type = visivel ? 'password' : 'text';
      icoFechado.style.display = visivel ? '' : 'none';
      icoAberto.style.display  = visivel ? 'none' : '';
    });

    // Shake no card se houver erro
    {% if erro %}
    const card = document.getElementById('login-card');
    card.classList.add('shake');
    card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
    {% endif %}

    // Feedback de loading no botão
    document.getElementById('form-login').addEventListener('submit', function () {
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
    });
  </script>
</body>
</html>
